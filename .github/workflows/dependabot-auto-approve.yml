name: Dependabot Auto-Approve

on:
  pull_request:

permissions:
  pull-requests: write

jobs:
  auto-approve:
    runs-on: ubuntu-22.04
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Branch protection requires one approving review; approvals are
      # dismissed on every push, so this re-approves after each rebase.
      # Needs "Allow GitHub Actions to approve pull requests" enabled in
      # repo Actions settings.
      #
      # Approve only — merging is deliberately left to a human. Dependabot
      # PRs go green and wait. The job has no contents:write for that reason.
      - name: Approve patch and minor updates
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
