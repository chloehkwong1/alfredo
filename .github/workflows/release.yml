name: Release
on:
  push:
    tags: ['v*']

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-26
            args: '--target aarch64-apple-darwin'
          - platform: macos-26
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-26' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - run: npm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          LINEAR_CLIENT_ID: ${{ secrets.LINEAR_CLIENT_ID }}
          LINEAR_CLIENT_SECRET: ${{ secrets.LINEAR_CLIENT_SECRET }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Alfredo ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download and install.'
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-beta') }}
          args: ${{ matrix.args }}

      - name: Update beta-latest pointer release
        if: contains(github.ref_name, '-beta') && matrix.platform == 'ubuntu-22.04'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Download latest.json from the real beta release we just published.
          gh release download "${{ github.ref_name }}" \
            --pattern "latest.json" \
            --clobber \
            --dir /tmp/beta

          # Force-move the beta-latest Git tag to the current commit.
          git tag -f beta-latest "${GITHUB_SHA}"
          git push origin beta-latest --force

          # Create (or update) a GitHub release at beta-latest holding latest.json.
          if gh release view beta-latest >/dev/null 2>&1; then
            gh release upload beta-latest /tmp/beta/latest.json --clobber
            gh release edit beta-latest \
              --prerelease \
              --notes "Updater pointer for the latest beta release. Real release: ${{ github.ref_name }}"
          else
            gh release create beta-latest /tmp/beta/latest.json \
              --title "beta-latest" \
              --prerelease \
              --notes "Updater pointer for the latest beta release. Real release: ${{ github.ref_name }}"
          fi
