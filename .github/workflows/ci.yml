name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      # Catches bundler-level breakage (import resolution, exports maps,
      # worker handling) that tsc and vitest can't see — a monaco bump
      # broke the v0.20.0 release build while PR CI stayed green (#59).
      - name: Production build
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --lib -- -D warnings
        env:
          LINEAR_CLIENT_ID: placeholder
          LINEAR_CLIENT_SECRET: placeholder

      - name: Run tests
        working-directory: src-tauri
        run: cargo test
        env:
          LINEAR_CLIENT_ID: placeholder
          LINEAR_CLIENT_SECRET: placeholder

  supply-chain:
    name: Supply Chain
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: src-tauri/Cargo.toml
