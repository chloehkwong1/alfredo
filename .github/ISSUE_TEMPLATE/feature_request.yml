name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: What would you like?
      description: Describe the feature or improvement.
      placeholder: "e.g. It would be great if Alfredo could..."
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Why?
      description: What problem does this solve for you?
    validations:
      required: false
