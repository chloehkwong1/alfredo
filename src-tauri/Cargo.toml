[package]
name = "alfredo"
version = "0.23.0-beta.2"
description = "AI Agent Management Desktop App"
authors = ["Chloe"]
edition = "2021"
publish = false
default-run = "alfredo"

[lib]
name = "alfredo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
portable-pty = "0.9"
# vendored-libgit2: statically build the bundled libgit2 instead of linking
# Homebrew's dylib. A local `tauri build` otherwise links /opt/homebrew's
# libgit2, which macOS refuses to load under library validation ("different
# Team IDs"), crashing the app on launch.
git2 = { version = "0.21", features = ["vendored-libgit2"] }
octocrab = { version = "0.41", default-features = false, features = ["default-client", "follow-redirect", "retry", "timeout", "tracing", "opentls"] }
openssl = { version = "0.10", features = ["vendored"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
bm25 = "2"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", features = ["json"] }
axum = "0.8"
thiserror = "2"
libc = "0.2"
chrono = { version = "0.4.44", features = ["serde"] }
futures = "0.3.32"
keyring = { version = "3", features = ["apple-native"] }
url = "2"
semver = "1"
dirs = "5"
rodio = { version = "0.20", default-features = false, features = ["wav"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
schemars = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSPasteboard"] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSProcessInfo", "NSString"] }
objc2-user-notifications = "0.3"
block2 = "0.6"

[target.'cfg(not(target_os = "macos"))'.dependencies]
notify-rust = "4"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
cloned_instead_of_copied = "warn"
manual_string_new = "warn"
implicit_clone = "warn"
uninlined_format_args = "warn"

[dev-dependencies]
tempfile = "3"
serial_test = "3"

[[bin]]
name = "gen_schema"
path = "src/bin/gen_schema.rs"
